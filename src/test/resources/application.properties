spring.main.banner-mode=off
spring.datasource.url=jdbc:h2:mem:aprswc-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
aprswc.application-version.application-name=APRSWelcomeCenter
aprswc.application-version.version=1.0.26
aprswc.application-version.author=John Rokicki KC1VMZ
aprswc.application-version.copyright-year=2026
aprswc.application-version.website=http://www.kc1vmz.com

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Generated REST API documentation and interactive explorer.
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
